<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift forr youu✨</title>
    
    <!-- Import cute kids handwriting font 'Gochi Hand' & 'Fredoka' from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Applied Gochi Hand as primary kids handwriting font with fallbacks */
            font-family: 'Gochi Hand', 'Comic Sans MS', cursive, sans-serif;
        }

        body {
            background-color: #fceade;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            user-select: none;
        }

        .hint-text {
            color: #8c7a6b;
            font-size: 1.4rem;
            margin-bottom: 55px;
            letter-spacing: 0.5px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        /* Envelope Wrapper */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transition: margin-top 0.5s ease;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #f3a683;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* Top Flap */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #e7886a;
            transform-origin: top;
            transition: transform 0.5s ease 0.2s, z-index 0.2s ease;
            z-index: 3;
        }

        /* Side Flaps */
        .envelope::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #f7b79d;
            border-right: 150px solid #f7b79d;
            border-bottom: 100px solid transparent;
            border-top: 100px solid transparent;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 2;
        }

        /* Wax Seal / Heart Tag */
        .heart-seal {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background-color: #e84393;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            z-index: 4;
            box-shadow: 0 4px 10px rgba(232, 67, 147, 0.3);
            transition: opacity 0.3s ease;
        }

        /* Letter Inside */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 270px;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.6s ease, opacity 0.4s ease, z-index 0s linear 0.3s;
            z-index: 1;
            opacity: 0;
            text-align: left;
        }

        .letter h2 {
            color: #d63038;
            font-size: 1.7rem;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .letter p {
            color: #6e2b34;
            font-size: 1.25rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .letter .signature {
            text-align: right;
            font-size: 1.35rem;
            color: #6e2b34;
            margin-top: 15px;
        }

        /* Open State Animations */
        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .envelope-wrapper.open .heart-seal {
            opacity: 0;
        }

        .envelope-wrapper.open .letter {
            opacity: 1;
            transform: translateY(-30px);
            z-index: 5;
            transition: transform 0.6s ease 0.3s, opacity 0.4s ease 0.3s;
        }

        .envelope-wrapper.open {
            margin-top: 140px;
        }
    </style>
</head>
<body>

    <div class="hint-text" id="hint">Click to open!</div>

    <div class="envelope-wrapper" onclick="toggleEnvelope()">
        <div class="envelope">
            <div class="heart-seal"></div>
            <div class="letter">
                <h2>Halo Angel,</h2>
                <p>I should have given you this yesterday but I couldn't make it on time, btw happy belated birthday once again!</p>
                <p>Hope the chocolate brings a smile to your face:)</p>
                <div class="signature">— Younorii</div>
            </div>
        </div>
    </div>

    <script>
        let isOpen = false;
        function toggleEnvelope() {
            const wrapper = document.querySelector('.envelope-wrapper');
            const hint = document.getElementById('hint');
            
            if (!isOpen) {
                wrapper.classList.add('open');
                hint.textContent = 'Click to close!';
                isOpen = true;
            } else {
                wrapper.classList.remove('open');
                hint.textContent = 'Click to open!';
                isOpen = false;
            }
        }
    </script>
</body>
</html>
