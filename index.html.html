<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift forr youu✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #fceade;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .hint-text {
            color: #8c7a6b;
            font-size: 0.95rem;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        /* Envelope Wrapper */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #f3a683;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* Top Flap */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #e7886a;
            transform-origin: top;
            transition: transform 0.5s ease 0.2s, z-index 0.2s ease;
            z-index: 3;
        }

        /* Side Flaps */
        .envelope::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #f7b79d;
            border-right: 150px solid #f7b79d;
            border-bottom: 100px solid transparent;
            border-top: 100px solid transparent;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 2;
        }

        /* Wax Seal / Heart Tag */
        .heart-seal {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background-color: #e84393;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            z-index: 4;
            box-shadow: 0 4px 10px rgba(232, 67, 147, 0.3);
            transition: opacity 0.3s ease;
        }

        /* Letter Inside */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 270px;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.6s ease 0.4s, opacity 0.4s ease;
            z-index: 1;
            opacity: 0;
            text-align: left;
        }

        .letter h2 {
            font-family: Georgia, 'Times New Roman', serif;
            color: #d63031;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .letter p {
            color: #555;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .letter .signature {
            text-align: right;
            font-style: italic;
            color: #888;
            margin-top: 15px;
            font-weight: 500;
        }

        /* Open State Animations */
        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .envelope-wrapper.open .heart-seal {
            opacity: 0;
        }

        .envelope-wrapper.open .letter {
            opacity: 1;
            transform: translateY(-160px);
            z-index: 5;
        }

        .envelope-wrapper.open {
            margin-top: 140px;
            transition: margin-top 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="hint-text" id="hint">Tekan plis..</div>

    <div class="envelope-wrapper" onclick="openEnvelope()">
        <div class="envelope">
            <div class="heart-seal">❤️</div>
            <div class="letter">
                <h2>Halo Angel,</h2>
                <p>I wanted to leave you a small digital note just to bring a little smile to your day.</p>
                <p>Hope you like this little gift!  </p>
                <div class="signature">— Younorii</div>
            </div>
        </div>
    </div>

    <script>
        let isOpen = false;
        function openEnvelope() {
            if (!isOpen) {
                document.querySelector('.envelope-wrapper').classList.add('open');
                document.getElementById('hint').textContent = '✨ ✨ ✨';
                isOpen = true;
            }
        }
    </script>
</body>
</html>
